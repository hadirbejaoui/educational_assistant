{% for field in form %}
    <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<small class="help">{{ field.help_text|safe }}</small>{% endif %}
        {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
    </div>
{% endfor %}
{% for error in form.non_field_errors %}<p class="error">{{ error }}</p>{% endfor %}
