{% extends "base.html" %}
{% block title %}Inscription{% endblock %}

{% block auth_content %}
<div class="card">
    <div class="card__body">
        <h1>Créer un compte</h1>
        <p class="text-muted">Quelques informations suffisent pour commencer.</p>
        <form method="post" novalidate class="mt-4">
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <button type="submit" class="btn btn-block">S'inscrire</button>
        </form>
    </div>
    <div class="card__footer"><p class="text-small">Déjà inscrit ? <a href="{% url 'accounts:login' %}">Se connecter</a></p></div>
</div>
{% endblock %}
