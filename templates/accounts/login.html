{% extends "base.html" %}
{% block title %}Connexion{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>Connexion</h1>
    <form method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn">Se connecter</button>
    </form>
    <p>Pas de compte ? <a href="{% url 'accounts:register' %}">Inscrivez-vous</a></p>
</div>
{% endblock %}
